name: Deploy API

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  IMAGE_NAME: zayedsagor/booking-api
  APP_DIR: /opt/apps/booking-api
  COMPOSE_SERVICE: api
  LOCAL_HEALTHCHECK_URL: http://127.0.0.1:8082/health
  PUBLIC_HEALTHCHECK_URL: https://booking-api.flowstacker.xyz/health

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ${{ env.APP_DIR }}
            docker compose pull
            docker compose run --rm ${{ env.COMPOSE_SERVICE }} npx prisma migrate deploy
            docker compose up -d ${{ env.COMPOSE_SERVICE }}
            for i in $(seq 1 24); do
              STATUS=$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q ${{ env.COMPOSE_SERVICE }})")
              [ "$STATUS" = "healthy" ] && break
              [ "$STATUS" = "unhealthy" ] && break
              sleep 5
            done
            if [ "$STATUS" != "healthy" ]; then
              echo "Container health check failed: ${STATUS:-unknown}"
              docker compose ps
              docker compose logs --no-color ${{ env.COMPOSE_SERVICE }}
              exit 1
            fi
            docker image prune -f
            curl -fsS ${{ env.LOCAL_HEALTHCHECK_URL }}
            curl -fsS ${{ env.PUBLIC_HEALTHCHECK_URL }}
